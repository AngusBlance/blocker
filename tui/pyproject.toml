[project]
name = "blocker-tui"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "textual",
    "blocklib",
]

[project.scripts]
block = "blocker_tui.app:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv.sources]
blocklib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blocker_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
