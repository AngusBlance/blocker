[project]
name = "blocklib"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["websockets"]

[project.scripts]
blocker-sync = "blocklib.sync_daemon:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blocklib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
