[tool.uv.workspace]
members = ["blocklib", "tui"]

[dependency-groups]
dev = ["pytest", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Explicit so new ruff releases don't change what CI enforces: the classic
# defaults (real errors) plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["blocklib", "blocker_tui"]
