name: Android APK

# Builds a standalone APK of the Flutter app (android/android-flutter). On pull
# requests it only checks it still builds (this is what compiles the Kotlin).
# On main it also signs it and publishes it as blocker-flutter.apk on the
# "android-latest" GitHub release, so it can be downloaded straight to a
# phone. Every build is signed with the same key (from repo secrets), so a new
# APK installs over the old one and keeps the block list and password.

on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  pull_request:
    paths:
      - android/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Flutter APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build release APK
        working-directory: android/android-flutter
        # Phones are arm64; skipping the other ABIs keeps the build quick.
        run: flutter build apk --release --target-platform android-arm64

      - name: Sign with the release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp android/android-flutter/build/app/outputs/flutter-apk/app-release.apk blocker-flutter.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias blocker \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            blocker-flutter.apk
          "$BUILD_TOOLS/apksigner" verify blocker-flutter.apk

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: blocker-flutter.apk
          path: blocker-flutter.apk

      - name: Publish android-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest blocker-flutter.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Download blocker-flutter.apk on your phone and open it to install."
