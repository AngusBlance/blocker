name: CI

# Lint and test every part of the repo on pull requests and on main, one job
# per platform and language so a failure says straight away which part broke.
# The live tests that edit the real /etc/hosts stay skipped here; run them
# yourself with RUN_LIVE_HOSTS_TESTS=1.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macbook-python:
    name: macbook / Python
    # The desktop app is macOS-only (sudo, /etc/hosts, launchd).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macbook
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - run: uv sync --all-packages --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # Each suite has its own conftest and rootdir, so run them separately.
      - name: Test blocklib
        working-directory: macbook/blocklib
        run: uv run --all-packages pytest

      - name: Test tui
        working-directory: macbook/tui
        run: uv run --all-packages pytest

      - name: Test packaging
        run: uv run --all-packages pytest tests

  macbook-extension:
    name: macbook / Chrome extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macbook/extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macbook/extension/package-lock.json

      - run: npm ci

      - name: Lint and check formatting
        run: npm run lint

  android-kotlin:
    name: android / Kotlin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KTLINT_VERSION: 1.8.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install ktlint
        run: |
          curl -sSLf -o "$RUNNER_TEMP/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/$KTLINT_VERSION/ktlint"
          chmod +x "$RUNNER_TEMP/ktlint"

      - name: Lint
        run: '"$RUNNER_TEMP/ktlint" "androidlib/**/*.kt" "android-flutter/android/app/src/**/*.kt"'

  android-flutter:
    name: android / Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/android-flutter
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - uses: gradle/actions/setup-gradle@v6

      # androidlib's JVM unit tests (schedule rules etc.). --config-only
      # generates the Gradle wrapper without building the app.
      - name: Kotlin unit tests
        run: |
          flutter build apk --config-only
          cd android && ./gradlew :app:testDebugUnitTest --no-daemon
